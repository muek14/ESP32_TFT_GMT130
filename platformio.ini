; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI wird komplett hier konfiguriert (keine User_Setup.h noetig)
; Display: GMT130 V1.0, 1.3" ST7789, 240x240, ohne CS-Pin
; Pins:    ELEGOO ESP32 (30 Pins)
; Ohne CS-Pin braucht der ST7789 SPI-Modus 3 (TFT_SPI_MODE)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=-1
    -D TFT_DC=27
    -D TFT_RST=26
    -D TFT_BL=25
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_SPI_MODE=SPI_MODE3
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
